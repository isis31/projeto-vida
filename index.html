<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus objetivos do ano</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo-principal">

        <h2 class="titulo-principal">
            Meus Objetivos do ano<span>_</span>
        </h2>


        <!-- BOTÕES -->

        <div class="botoes">

            <button class="botao ativo" data-conteudo="ensino">
                Terminar o Ensino Médio
            </button>

            <button class="botao" data-conteudo="ingles">
                Curso de Inglês
            </button>

            <button class="botao" data-conteudo="treinar">
                Treinar
            </button>

            <button class="botao" data-conteudo="trabalhar">
                Trabalhar
            </button>

        </div>


        <!-- CONTEÚDOS -->

        <div class="abas-textos">


            <!-- ENSINO MÉDIO -->

            <div class="aba-conteudo ativo" id="ensino">

                <h3 class="aba-conteudo-titulo-principal">
                    Terminar o Ensino Médio
                </h3>

                <h4 class="aba-conteudo-titulo-secundario">
                    Até 10/12/2026
                </h4>

                <div class="contador" id="contador-ensino">
                    Carregando...
                </div>

            </div>


            <!-- CURSO DE INGLÊS -->

            <div class="aba-conteudo" id="ingles">

                <h3 class="aba-conteudo-titulo-principal">
                    Curso de Inglês
                </h3>

                <h4 class="aba-conteudo-titulo-secundario">
                    Até 15/12/2026
                </h4>

                <div class="contador" id="contador-ingles">
                    Carregando...
                </div>

            </div>


            <!-- TREINAR -->

            <div class="aba-conteudo" id="treinar">

                <h3 class="aba-conteudo-titulo-principal">
                    Treinar
                </h3>

                <h4 class="aba-conteudo-titulo-secundario">
                    Segunda a sexta
                </h4>

                <div class="rotina">
                    🏋️ Treino de segunda a sexta
                </div>

            </div>


            <!-- TRABALHAR -->

            <div class="aba-conteudo" id="trabalhar">

                <h3 class="aba-conteudo-titulo-principal">
                    Trabalhar
                </h3>

                <h4 class="aba-conteudo-titulo-secundario">
                    Segunda a sexta
                </h4>

                <div class="rotina">
                    💼 Trabalho de segunda a sexta
                </div>

            </div>


        </div>

    </section>


    <script src="main.js"></script>

</body>

</html>
